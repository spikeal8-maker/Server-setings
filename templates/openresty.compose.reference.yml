# Пример конфигурации реально работающей 1Panel OpenResty от 19.10.2026.
# НЕ применять docker compose отдельно от панели: запись приложения создаёт 1Panel.
services:
  openresty:
    build:
      context: ./build
      args:
        - PANEL_OPENRESTY_VERSION=1.27.1.2-5-1-focal
        - RESTY_CONFIG_OPTIONS_MORE=${RESTY_CONFIG_OPTIONS_MORE}
        - RESTY_ADD_PACKAGE_BUILDDEPS=${RESTY_ADD_PACKAGE_BUILDDEPS}
        - CONTAINER_PACKAGE_URL=${CONTAINER_PACKAGE_URL}
    container_name: ${CONTAINER_NAME}
    image: 1panel/openresty:1.27.1.2-5-1-focal
    network_mode: host
    restart: always
    volumes:
      - ./conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./conf/default:/usr/local/openresty/nginx/conf/default/
      - ./conf/ssl:/usr/local/openresty/nginx/conf/ssl/
      - ./log:/var/log/nginx
      - ./root:/usr/share/nginx/html
      - ${WEBSITE_DIR}:/www
      - ${WEBSITE_DIR}/conf.d:/usr/local/openresty/nginx/conf/conf.d/
