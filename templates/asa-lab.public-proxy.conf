# Проверенный 19.10.2026 фрагмент прокси в OpenResty.
# ВАЖНО: запись сайта, сертификат, порт 80/443 управляются 1Panel.
# Добавление этого файла напрямую без регистрации сайта в 1Panel запрещено.
location ^~ / {
    proxy_pass http://127.0.0.1:4610;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_ssl_server_name off;
}
