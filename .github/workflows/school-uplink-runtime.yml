name: School uplink runtime isolated namespaces
on:
  pull_request:
    paths: ['scripts/school_uplink_runtime/**', 'scripts/school-uplink-runtime.py', 'scripts/school-internet-offline.py', 'scripts/school-internet-dispatch.py', 'scripts/install-school-uplink-runtime.py', 'scripts/asa-school-dhcp-hook', 'tests/test_school_uplink_installer.py', 'tests/uplink_netns/**', 'units/asa-school-uplink*', '.github/workflows/school-uplink-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile source without host installation
        run: |
          python3 -m compileall -q scripts/school_uplink_runtime scripts/school-uplink-runtime.py scripts/school-internet-dispatch.py scripts/install-school-uplink-runtime.py tests/uplink_netns
          python3 -m unittest discover -s tests -p test_school_uplink_installer.py -v
      - name: Real routes TLS DNS and rollback inside disposable network namespaces
        run: |
          sudo env ASA_TEST_HOST_NETNS="$(readlink /proc/self/ns/net)" ASA_TEST_HOST_PIDNS="$(readlink /proc/self/ns/pid)" ASA_TEST_HOST_MNTNS="$(readlink /proc/self/ns/mnt)" \
            unshare --net --mount --pid --fork --propagation private --mount-proc python3 -m unittest discover -s tests/uplink_netns -v
