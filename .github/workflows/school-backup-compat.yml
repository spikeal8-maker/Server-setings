name: School backup compatibility
on:
  pull_request:
    paths:
      - 'scripts/install-school-nightly-database-backup.py'
      - 'scripts/school-nightly-database-backup.py'
      - 'scripts/school-gfs-backup.py'
      - 'scripts/install-school-gfs-backup.py'
      - 'tests/test_school_nightly_timer.py'
      - 'tests/test_school_nightly_database.py'
      - 'tests/test_school_gfs_backup.py'
      - 'tests/test_school_backup_receipt_contract.py'
      - 'tests/fixtures/school-backup-success.json'
      - '.github/workflows/school-backup-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fault-injected timer rollback and actual receipt-writer contract
        run: python -m unittest discover -s tests -p 'test_school_nightly*.py' -v
      - name: Published receipt matches the real producer
        run: python -m unittest discover -s tests -p test_school_backup_receipt_contract.py -v
      - name: VM100 GFS backup retention and safety contracts
        run: python -m unittest discover -s tests -p test_school_gfs_backup.py -v
      - run: git diff --check
