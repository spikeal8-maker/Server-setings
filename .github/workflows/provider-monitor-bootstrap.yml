name: Provider monitor reproducible bootstrap
on:
  pull_request:
    paths:
      - 'scripts/bootstrap-provider-monitor.py'
      - 'templates/provider-monitor/**'
      - 'tests/*provider*'
      - '.github/workflows/provider-monitor-bootstrap.yml'
  push:
    paths:
      - 'scripts/bootstrap-provider-monitor.py'
      - 'templates/provider-monitor/**'
      - 'tests/*provider*'
      - '.github/workflows/provider-monitor-bootstrap.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spikeal8-maker/asa-lab
          ref: 2a28cffe7a20302f9b7231ef823bdc05f3fe43d0
          path: pinned-app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline bootstrap and existing exporter contracts
        working-directory: infra
        env:
          ASA_PROVIDER_TEST_SOURCE: ${{ github.workspace }}/pinned-app
        run: |
          python -B -X utf8 -m unittest discover -s tests -p test_provider_monitor_bootstrap.py -v
          python -B -X utf8 -m unittest discover -s tests -p test_provider_health_exporter.py -v
  ephemeral-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: spikeal8-maker/asa-lab
          ref: 2a28cffe7a20302f9b7231ef823bdc05f3fe43d0
          path: pinned-app
          persist-credentials: false
      - name: Stage exact Git bytes under root-controlled parents
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /var/lib/asa-provider-bootstrap-ci-source
          test ! -e /var/lib/asa-provider-bootstrap-ci-app
          sudo install -d -m 755 /var/lib/asa-provider-bootstrap-ci-source /var/lib/asa-provider-bootstrap-ci-app
          git archive HEAD scripts/bootstrap-provider-monitor.py scripts/provider_health_exporter.py templates/provider-monitor docs/48-ISOLATED-PROVIDER-MONITOR.md tests/test_provider_monitor_bootstrap.py tests/test_provider_health_exporter.py tests/provider_monitor_bootstrap_ci.py | sudo tar --no-same-owner -x -C /var/lib/asa-provider-bootstrap-ci-source
          git -C ../pinned-app archive HEAD tools/collect_logs.py tools/collect-windows-logs.ps1 tools/resource_sampling.py tools/memory_sampling.py tools/deployment/__init__.py tools/deployment/paths.py tools/deployment/operational.py | sudo tar --no-same-owner -x -C /var/lib/asa-provider-bootstrap-ci-app
          # Git archive records 0664 files; root tar preserves them. Strengthen only
          # these fresh, absent-before-stage CI trees before any root execution.
          sudo chmod -R go-w /var/lib/asa-provider-bootstrap-ci-source /var/lib/asa-provider-bootstrap-ci-app
      - name: Root native guards, unchanged runtime and pinned consumer tests
        run: |
          sudo env ASA_PROVIDER_BOOTSTRAP_ROOT_TESTS=1 ASA_PROVIDER_TEST_SOURCE=/var/lib/asa-provider-bootstrap-ci-app python3 -B -X utf8 -m unittest discover -s /var/lib/asa-provider-bootstrap-ci-source/tests -p test_provider_monitor_bootstrap.py -v
          sudo env ASA_PROVIDER_TEST_SOURCE=/var/lib/asa-provider-bootstrap-ci-app python3 -B -X utf8 -m unittest discover -s /var/lib/asa-provider-bootstrap-ci-source/tests -p test_provider_health_exporter.py -v
      - name: Actual install, repeat apply, systemd timer, owner integration and consumer
        run: |
          sudo env GITHUB_ACTIONS=true ASA_EPHEMERAL_BOOTSTRAP_CI=1 python3 -I -B /var/lib/asa-provider-bootstrap-ci-source/tests/provider_monitor_bootstrap_ci.py --owner "$(id -un)"
